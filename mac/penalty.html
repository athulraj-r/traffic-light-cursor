<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>MANDATORY TRAFFIC SAFETY SCHOOL — SPEEDING PENALTY</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif;
    }
    .header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      background: linear-gradient(180deg, rgba(200, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.6) 100%);
      color: #fff;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(255, 59, 48, 0.6);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    }
    .badge {
      background: #ff3b30;
      color: #fff;
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    video {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #000;
    }
    .footer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.7);
      color: #ffcc00;
      font-size: 11px;
      text-align: center;
      padding: 8px;
      font-weight: 600;
      letter-spacing: 1px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="header">
    <span>🚨 MANDATORY TRAFFIC SAFETY SCHOOL</span>
    <span class="badge">PENALTY IN PROGRESS</span>
  </div>
  <video id="player" src="video.mp4" autoplay playsinline></video>
  <div class="footer">
    CURSOR FROZEN • DO NOT ATTEMPT TO CLOSE • LESSON MUST BE COMPLETED IN FULL
  </div>

  <script>
    const player = document.getElementById('player');
    function finish() {
      if (window.trafficAPI && window.trafficAPI.penaltyEnded) {
        window.trafficAPI.penaltyEnded();
      }
    }
    player.addEventListener('ended', finish);
    player.addEventListener('error', finish);

    // Escape triggers emergency exit
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (window.trafficAPI && window.trafficAPI.emergencyExit) {
          window.trafficAPI.emergencyExit();
        }
      }
    });
  </script>
</body>
</html>
